server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    # Forward API calls to the backend container, so the browser only ever talks to this origin
    location /api/ {
        proxy_pass http://spa-backend:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed bundles from Vite never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every unknown path gets index.html (with status 200, even for "404" pages)
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
