{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="gw-page-head">
  <div><h1>User management</h1><p id="user-count">Loading accounts…</p></div>
  <a class="btn btn-primary" href="/admin/users/new"><i class="bi bi-person-plus"></i> Add user</a>
</div>
<div class="gw-card">
  <form class="gw-filters" id="user-filters">
    <input class="form-control form-control-sm" type="search" name="q" placeholder="Name, username or email" autocomplete="off">
    <select class="form-select form-select-sm" name="role" aria-label="Role">
      <option value="">All roles</option>
      {% for key, label in ROLES.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
    </select>
    <select class="form-select form-select-sm" name="status" aria-label="Status">
      <option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option>
    </select>
  </form>
  <div id="user-table"></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/users.js"></script>{% endblock %}
