{% extends "base.html" %}
{% block title %}Team calendar{% endblock %}
{% block content %}
<div class="gw-page-head">
  <div><h1>Team calendar</h1><p id="cal-summary">Approved leave across the company.</p></div>
  <div class="btn-group" id="cal-nav"></div>
</div>
<div class="gw-card">
  <div class="gw-card-head"><h2 id="cal-label">&nbsp;</h2>
    <div class="d-flex gap-2 small"><span class="gw-chip">Annual</span><span class="gw-chip text-danger">Medical</span><span class="gw-chip">Compassionate</span><span class="gw-chip">Unpaid</span></div>
  </div>
  <div class="table-responsive" id="cal-grid"></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/calendar.js"></script>{% endblock %}
